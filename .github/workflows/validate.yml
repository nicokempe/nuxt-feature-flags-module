name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.17.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tooling
        run: pnpm run release:check

      - name: Run lint
        run: pnpm run lint

      - name: Prepare module types
        run: pnpm run dev:prepare

      - name: Run tests
        run: pnpm run test

      - name: Run type tests
        run: pnpm run test:types

      - name: Build package
        run: pnpm run prepack
