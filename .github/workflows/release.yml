name: Release
run-name: Release nuxt-feature-flags-module ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: nuxt-feature-flags-module-release
  cancel-in-progress: false

env:
  NPM_CLI_VERSION: 12.0.2
  PACKAGE_NAME: nuxt-feature-flags-module
  PACKAGE_REGISTRY: https://registry.npmjs.org

jobs:
  prepare:
    name: Prepare release
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Require the main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Run releases from the main branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Require the latest main commit
        run: |
          git fetch --force origin main
          git fetch --force --tags origin
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main changed while this release was queued. Run the workflow again."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install trusted publishing npm CLI
        run: npm install --global "npm@${NPM_CLI_VERSION}"

      - name: Resume an incomplete tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_version="$(node -p "require('./package.json').version")"
          if ! [[ "${current_version}" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version ${current_version} does not use YYYY.M.N."
            exit 1
          fi

          tagged_commit="$(git rev-parse --verify --quiet "refs/tags/${current_version}^{commit}" || true)"
          if [[ -z "${tagged_commit}" ]]; then
            echo "${current_version} has no release tag; preparing a new release."
            exit 0
          fi
          if ! git merge-base --is-ancestor "${tagged_commit}" HEAD; then
            echo "::error::Release tag ${current_version} is not an ancestor of main."
            exit 1
          fi

          supports_tag_publish=false
          if git show "${current_version}:.github/workflows/release.yml" | grep -q "if: github.ref_type == 'tag'"; then
            supports_tag_publish=true
          fi

          package_lookup_error="${RUNNER_TEMP}/nuxt-feature-flags-module-resume-lookup.log"
          set +e
          published_version="$(npm view "${PACKAGE_NAME}@${current_version}" version --registry "${PACKAGE_REGISTRY}" 2>"${package_lookup_error}")"
          package_lookup_status=$?
          set -e

          if [[ ${package_lookup_status} -eq 0 ]]; then
            if [[ "${published_version}" != "${current_version}" ]]; then
              echo "::error::Registry returned unexpected version ${published_version}."
              exit 1
            fi
            release_lookup_error="${RUNNER_TEMP}/nuxt-feature-flags-module-release-lookup.log"
            release_ready_query='.draft == false and .prerelease == false'
            if [[ "${supports_tag_publish}" == "true" ]]; then
              release_ready_query+=" and any(.assets[]; .name == \"${PACKAGE_NAME}-${current_version}.tgz\")"
            fi
            if release_ready="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${current_version}" --jq "${release_ready_query}" 2>"${release_lookup_error}")"; then
              if [[ "${release_ready}" == "true" ]]; then
                echo "${PACKAGE_NAME}@${current_version} and its GitHub Release are complete; preparing the next release."
                exit 0
              fi
            elif ! grep -Eq 'HTTP 404|Not Found' "${release_lookup_error}"; then
              cat "${release_lookup_error}"
              exit 1
            fi
            echo "npm already contains ${current_version}; resuming its incomplete GitHub Release."
          elif ! grep -Eq 'E404|404 Not Found' "${package_lookup_error}"; then
            cat "${package_lookup_error}"
            exit "${package_lookup_status}"
          fi

          if [[ "${supports_tag_publish}" != "true" ]]; then
            echo "::error::Historical tag ${current_version} cannot resume through zero-input publishing."
            exit 1
          fi
          git checkout --detach "${tagged_commit}"
          tagged_version="$(node -p "require('./package.json').version")"
          if [[ "${tagged_version}" != "${current_version}" ]]; then
            echo "::error::Release tag ${current_version} contains package version ${tagged_version}."
            exit 1
          fi
          echo "Resuming release ${current_version} from ${tagged_commit}."

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tooling
        run: pnpm run release:check

      - name: Prepare version and changelog
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/nuxt-feature-flags-module-release-notes.md
        run: |
          node scripts/release/prepare-release.ts \
            --github-output "${GITHUB_OUTPUT}" \
            --notes-file "${RELEASE_NOTES_PATH}"

      - name: Check release diff
        run: git diff --check

      - name: Run lint
        run: pnpm run lint

      - name: Prepare module types
        run: pnpm run dev:prepare

      - name: Run tests
        run: pnpm run test

      - name: Run type tests
        run: pnpm run test:types

      - name: Build and pack publishable package
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_archive_directory="${RUNNER_TEMP}/nuxt-feature-flags-module-package"
          mkdir -p "${package_archive_directory}"
          pnpm pack --pack-destination "${package_archive_directory}"
          package_archive="${package_archive_directory}/${PACKAGE_NAME}-${VERSION}.tgz"
          test -s "${package_archive}"
          tar -tzf "${package_archive}" > "${package_archive}.contents"
          for required_file in dist/module.mjs dist/types.d.mts dist/runtime/plugin.js dist/runtime/server/isFeatureEnabled.js dist/runtime/utils/flagValidator.js; do
            grep -Fx "package/${required_file}" "${package_archive}.contents" > /dev/null
          done
          git diff --exit-code -- src/runtime
          echo "archive_path=${package_archive}" >> "${GITHUB_OUTPUT}"

      - name: Commit and tag release
        if: steps.release.outputs.should_commit == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch --force origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main changed during validation. Run the workflow again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::error::Release preparation did not create a commit."
            exit 1
          fi
          git commit -m "chore(release): ${VERSION}"
          git tag --annotate "${VERSION}" --message "${VERSION}"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${VERSION}"

      - name: Queue trusted publish from the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          if [[ "${source_commit}" != "${tagged_commit}" ]]; then
            echo "::error::Release tag ${VERSION} does not point at the prepared commit."
            exit 1
          fi

          if ! git show "${VERSION}:.github/workflows/release.yml" | grep -q "if: github.ref_type == 'tag'"; then
            echo "::error::Release tag ${VERSION} predates zero-input publishing. It cannot be published with matching provenance by this workflow."
            exit 1
          fi

          gh workflow run release.yml --ref "${VERSION}"
          {
            echo "## Release ${VERSION} prepared"
            echo "The version, changelog, and annotated tag are ready."
            echo "Publishing starts automatically from the immutable release tag."
            echo "[Follow the publish run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml?query=branch%3A${VERSION})"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish public npm package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: publish-workflow
    env:
      VERSION: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate publish request
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Publish version ${VERSION} does not use YYYY.M.N."
            exit 1
          fi
          if ! [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A full release commit SHA is required."
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release tag and provenance source
        run: |
          git fetch --force --tags origin
          checked_out_commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse --verify "refs/tags/${VERSION}^{commit}")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${checked_out_commit}" != "${SOURCE_COMMIT}" || "${tagged_commit}" != "${SOURCE_COMMIT}" ]]; then
            echo "::error::Release tag ${VERSION}, requested commit, and checkout must be identical."
            exit 1
          fi
          if [[ "${package_version}" != "${VERSION}" ]]; then
            echo "::error::Release tag ${VERSION} contains package version ${package_version}."
            exit 1
          fi

          if [[ "${GITHUB_SHA}" != "${tagged_commit}" || "${GITHUB_REF}" != "refs/tags/${VERSION}" ]]; then
            echo "::error::Publishing must run from the exact release tag and commit for npm provenance."
            exit 1
          fi
          echo "Publishing with npm provenance from ${GITHUB_REF}."

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install trusted publishing npm CLI
        run: npm install --global "npm@${NPM_CLI_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tooling
        run: pnpm run release:check

      - name: Restore release notes
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/nuxt-feature-flags-module-release-notes.md
        run: |
          node scripts/release/prepare-release.ts \
            --github-output "${GITHUB_OUTPUT}" \
            --notes-file "${RELEASE_NOTES_PATH}"

      - name: Require an immutable prepared release
        env:
          PREPARED_VERSION: ${{ steps.release.outputs.version }}
          SHOULD_COMMIT: ${{ steps.release.outputs.should_commit }}
        run: |
          if [[ "${PREPARED_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Prepared version ${PREPARED_VERSION} does not match requested version ${VERSION}."
            exit 1
          fi
          if [[ "${SHOULD_COMMIT}" != "false" ]]; then
            echo "::error::Publishing is only allowed from an existing immutable release tag."
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Release restoration modified the tagged source."
            exit 1
          fi

      - name: Run lint
        run: pnpm run lint

      - name: Prepare module types
        run: pnpm run dev:prepare

      - name: Run tests
        run: pnpm run test

      - name: Run type tests
        run: pnpm run test:types

      - name: Build and pack publishable package
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_archive_directory="${RUNNER_TEMP}/nuxt-feature-flags-module-package"
          mkdir -p "${package_archive_directory}"
          pnpm pack --pack-destination "${package_archive_directory}"
          package_archive="${package_archive_directory}/${PACKAGE_NAME}-${VERSION}.tgz"
          test -s "${package_archive}"
          tar -tzf "${package_archive}" > "${package_archive}.contents"
          for required_file in dist/module.mjs dist/types.d.mts dist/runtime/plugin.js dist/runtime/server/isFeatureEnabled.js dist/runtime/utils/flagValidator.js; do
            grep -Fx "package/${required_file}" "${package_archive}.contents" > /dev/null
          done
          git diff --exit-code -- src/runtime
          echo "archive_path=${package_archive}" >> "${GITHUB_OUTPUT}"

      - name: Publish public npm package with OIDC
        env:
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive_path }}
        run: |
          package_lookup_error="${RUNNER_TEMP}/nuxt-feature-flags-module-package-lookup.log"
          set +e
          published_version="$(npm view "${PACKAGE_NAME}@${VERSION}" version --registry "${PACKAGE_REGISTRY}" 2>"${package_lookup_error}")"
          package_lookup_status=$?
          set -e

          if [[ ${package_lookup_status} -eq 0 ]]; then
            if [[ "${published_version}" != "${VERSION}" ]]; then
              echo "::error::Registry returned unexpected version ${published_version}."
              exit 1
            fi
            echo "${PACKAGE_NAME}@${VERSION} is already published; skipping."
          elif grep -Eq 'E404|404 Not Found' "${package_lookup_error}"; then
            npm publish "${PACKAGE_ARCHIVE}" --access public --provenance
          else
            cat "${package_lookup_error}"
            exit "${package_lookup_status}"
          fi

      - name: Create or update GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_NOTES_PATH: ${{ steps.release.outputs.release_notes_path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs')
            const version = process.env.VERSION
            const releaseNotesPath = process.env.RELEASE_NOTES_PATH
            if (!version || !releaseNotesPath) {
              throw new Error('Release version and notes path are required.')
            }

            const releaseBody = readFileSync(releaseNotesPath, 'utf8')
            let existingRelease = null
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              })
              existingRelease = response.data
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            if (existingRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existingRelease.id,
                tag_name: version,
                name: version,
                body: releaseBody,
                draft: false,
                prerelease: false,
              })
            } else {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: version,
                name: version,
                body: releaseBody,
                draft: false,
                prerelease: false,
              })
            }

      - name: Attach npm package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive_path }}
        run: |
          gh release upload "${VERSION}" "${PACKAGE_ARCHIVE}" --clobber
          {
            echo "## Released ${PACKAGE_NAME}@${VERSION}"
            echo "- [npm package](https://www.npmjs.com/package/${PACKAGE_NAME}/v/${VERSION})"
            echo "- [GitHub Release and npm tarball](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION})"
            echo "- Source commit: ${SOURCE_COMMIT}"
            echo "- npm provenance: enabled"
          } >> "${GITHUB_STEP_SUMMARY}"
